apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app

resources:
  - ../../base

# Scale replicas for production
replicas:
  - name: splittrack
    count: 1

# Production image from your Harbor registry
images:
  - name: splittrack
    newName: harbor.smolelab.com/og/splittrack
    newTag: latest

# Production ConfigMap overrides
configMapGenerator:
  - name: splittrack-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - APP_URL=https://splittrack.smolelab.com
