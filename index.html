<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SplitTrack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <title>SplitTrack — Shared Expense & Bill Tracker</title>
    <meta name="title" content="SplitTrack — Shared Expense & Bill Tracker" />
    <meta name="description" content="Effortlessly track, split, and settle shared group expenses and recurring subscriptions." />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SplitTrack" />
    <meta property="og:title" content="SplitTrack — Shared Expense & Bill Tracker" />
    <meta property="og:description" content="Effortlessly track, split, and settle shared group expenses and recurring subscriptions." />
    <meta property="og:image" content="/og-banner.jpg" />
    <meta property="og:image:secure_url" content="/og-banner.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="616" />
    <meta property="og:image:alt" content="SplitTrack — Shared Expense Tracker" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SplitTrack — Shared Expense & Bill Tracker" />
    <meta name="twitter:description" content="Effortlessly track, split, and settle shared group expenses and recurring subscriptions." />
    <meta name="twitter:image" content="/og-banner.jpg" />
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />
    <link rel="modulepreload" href="/src/main.tsx" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0A0A0A;
        color: #E0E0E0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .splittrack-loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        background-color: #0A0A0A;
        box-sizing: border-box;
        user-select: none;
      }
      .splittrack-loader-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .splittrack-loader-aura {
        position: absolute;
        inset: -6px;
        border-radius: 22px;
        background: radial-gradient(circle, rgba(201, 255, 85, 0.25) 0%, rgba(201, 255, 85, 0) 70%);
        filter: blur(10px);
        pointer-events: none;
      }
      .splittrack-loader-logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        object-fit: cover;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 0 20px -3px rgba(201, 255, 85, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: block;
        animation: splittrack-pulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .splittrack-loader-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .splittrack-loader-spinner {
        width: 20px;
        height: 20px;
        display: block;
        animation: splittrack-spin 0.85s linear infinite;
      }
      .splittrack-loader-text {
        color: #999999;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      @keyframes splittrack-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splittrack-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.88; transform: scale(0.985); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splittrack-loader-container">
        <div class="splittrack-loader-logo-wrap">
          <div class="splittrack-loader-aura"></div>
          <img
            src="/logo.webp"
            alt="SplitTrack"
            class="splittrack-loader-logo"
            width="56"
            height="56"
          />
        </div>
        <div class="splittrack-loader-status">
          <svg class="splittrack-loader-spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9.5" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2.5" />
            <circle cx="12" cy="12" r="9.5" stroke="#C9FF55" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="16 44" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
